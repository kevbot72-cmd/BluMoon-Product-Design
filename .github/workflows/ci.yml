name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, static analysis, unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse
      - run: composer test:unit

  js:
    name: JS — types, lint, unit tests, schema, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run schema:check
      - run: npm run build

  integration:
    name: PHP integration — WordPress ${{ matrix.wp }} + WooCommerce, HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: latest, wc: latest-stable, php: '8.4', hpos: 'on' }
          - { wp: latest, wc: latest-stable, php: '8.4', hpos: 'off' }
          # Minimum supported versions; the WordPress test library must match core.
          - { wp: '6.6', wc: '9.0.2', php: '8.2', hpos: 'on', tests_lib: '~6.6.0' }
    services:
      mysql:
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=10
    env:
      WP_DB_HOST: 127.0.0.1:3306
      WP_DB_PASSWORD: root
      BPS_TEST_HPOS: ${{ matrix.hpos }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, imagick
          coverage: none
      - run: composer install --no-interaction --no-progress
      - if: matrix.tests_lib
        run: composer require --dev --no-interaction --no-progress -W "wp-phpunit/wp-phpunit:${{ matrix.tests_lib }}"
      - run: tests/php/bin/install-wp.sh /tmp/wp ${{ matrix.wp }} ${{ matrix.wc }}
      - run: composer test:integration
        env:
          WP_CORE_DIR: /tmp/wp/wordpress

  e2e:
    name: E2E — Playwright on wp-env
    runs-on: ubuntu-latest
    needs: [js]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --no-progress --no-dev
      - run: npm run build
      - run: npm run env:start
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Release zip
    runs-on: ubuntu-latest
    needs: [php, js, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: blumoon-product-studio
          path: dist/blumoon-product-studio.zip
          retention-days: 30
